name: CD - Deploy to Coolify

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-coolify-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Coolify deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Coolify webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_WEBHOOK_URL}" ]; then
            echo "COOLIFY_WEBHOOK_URL secret is not configured."
            exit 1
          fi

          if [ -n "${COOLIFY_WEBHOOK_TOKEN}" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer ${COOLIFY_WEBHOOK_TOKEN}" \
              "${COOLIFY_WEBHOOK_URL}"
          else
            curl -fsS -X POST "${COOLIFY_WEBHOOK_URL}"
          fi

      - name: Deployment success
        if: success()
        run: |
          echo "Coolify deployment triggered"
          echo "Commit: ${{ github.sha }}"

      - name: Deployment failure
        if: failure()
        run: |
          echo "Coolify deployment trigger failed"
          echo "Commit: ${{ github.sha }}"
